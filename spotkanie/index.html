<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a meeting — monstelo × mobilki at IFA Berlin 2026</title>
<meta name="description" content="Book 15, 30 or 45 minutes with Monstelo at IFA Berlin 2026 — Reseller Park, stand H27E-17, 4–8 September.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}

  :root{
    --bg:#0A0B0E; --card:#12151B; --field:#171C24; --line:#242A34;
    --ink:#F1EDE3; --mute:#8A8F9A;
    --amber:#FFB020; --amber-ink:#0A0B0E; --teal:#2FE3C6; --bad:#FF6B5A;
    --sans:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#F4F1E9; --card:#FFFFFF; --field:#F6F3EA; --line:#DFD9CB;
    --ink:#15171E; --mute:#5A5D68; --amber:#E09400; --amber-ink:#FFFFFF; --teal:#0E9C86;
  }

  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}

  .banner{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:18px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
  .card h1{font-size:23px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
  .intro{font-size:13.5px;line-height:1.55;color:var(--mute);margin-bottom:20px}

  .with{display:flex;align-items:center;gap:11px;background:var(--field);border:1px solid var(--teal);
    border-radius:10px;padding:11px 13px;margin-bottom:18px}
  .with .ini{flex:none;width:34px;height:34px;border-radius:8px;background:var(--teal);color:#07100E;
    font-family:var(--mono);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .with .n{display:block;font-size:15px;font-weight:700;line-height:1.2}
  .with .r{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--mute);margin-top:2px}

  .f{margin-bottom:15px}
  .f.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:0 0 6px}
  label .opt{font-weight:400}
  /* appearance:none TYLKO dla pól tekstowych i list — checkboxy muszą zostać checkboxami,
     inaczej znika i wygląd, i możliwość kliknięcia. */
  input:not([type="checkbox"]),select,textarea{width:100%;background:var(--field);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--sans);
    font-size:16px;padding:13px;outline:none;appearance:none;-webkit-appearance:none}
  input[type="checkbox"]{appearance:auto;-webkit-appearance:checkbox;width:22px;height:22px;
    flex:none;margin:0;cursor:pointer}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),
                          linear-gradient(135deg,var(--mute) 50%,transparent 50%);
    background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
  select:disabled{opacity:.55}
  input:focus,select:focus,textarea:focus{border-color:var(--teal)}
  input.bad,select.bad,textarea.bad{border-color:var(--bad)}
  textarea{resize:vertical;min-height:74px}
  .hint{font-size:11.5px;line-height:1.5;color:var(--mute);margin:-6px 0 15px}
  .hint.warn{color:var(--amber)}

  .evening{display:flex;gap:10px;align-items:flex-start;background:var(--field);border:1px solid var(--line);
    border-radius:10px;padding:12px 13px;margin-bottom:15px;cursor:pointer}
  .evening input{margin-top:1px;accent-color:var(--amber)}
  .evening b{font-size:13.5px;font-weight:600;display:block}
  .evening .sub{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;line-height:1.45}

  .consent{display:flex;gap:10px;align-items:flex-start;margin:2px 0 16px;cursor:pointer}
  .consent input{margin-top:1px;accent-color:var(--teal)}
  .consent span{font-size:11.5px;line-height:1.5;color:var(--mute)}
  .consent a{color:var(--teal)}

  button.send{width:100%;cursor:pointer;border:0;border-radius:999px;padding:16px;
    background:var(--amber);color:var(--amber-ink);font-family:var(--sans);font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:10px}
  button.send:disabled{opacity:.55;cursor:default}
  button.send .arrow{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;
    display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}

  .msg{margin-top:12px;font-size:13.5px;line-height:1.5;min-height:1em}
  .msg.bad{color:var(--bad)}

  .done{text-align:center;padding:6px 0 4px}
  .done .tick{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--teal);
    color:#07100E;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .done h2{font-size:22px;font-weight:800;margin-bottom:8px}
  .done .when{font-family:var(--mono);font-size:14px;color:var(--teal);letter-spacing:.03em}
  .done .who{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:4px}
  .done p{font-size:13.5px;line-height:1.6;color:var(--mute);margin:14px 0 16px}
  .done a.cal{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:999px;
    padding:12px 20px;color:var(--ink);font-size:14px;font-weight:600}

  footer{margin-top:18px;text-align:center;color:var(--mute);font-size:11.5px;line-height:1.8}
  footer a{color:var(--mute)}
  .themebtn{position:fixed;right:12px;bottom:12px;z-index:9;cursor:pointer;background:var(--card);
    border:1px solid var(--line);border-radius:999px;color:var(--mute);font-family:var(--mono);
    font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px}

  select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
    outline:2px solid var(--teal);outline-offset:2px}
  @media(max-width:420px){ .f.two{grid-template-columns:1fr} }
</style>
<script>
  (function(){ try{ var t=localStorage.getItem('ifa-design'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){} })();
</script>
</head>
<body>
<div class="wrap">

  <picture>
    <source media="(max-width:640px)" srcset="assets/banner-800.png">
    <img class="banner" src="assets/banner.png" width="1600" height="791"
         alt="monstelo × mobilki at IFA Berlin 2026 — Reseller Park, stand H27E-17, 4–8 September">
  </picture>

  <div class="card">
    <h1>Book a meeting</h1>
    <p class="intro">Book a meeting with our team at IFA Berlin 2026.<br>
      Reseller Park · stand H27E-17B.</p>

    <form id="form" novalidate>

      <div class="with" id="with-line" hidden>
        <span class="ini" id="with-ini"></span>
        <span><span class="n" id="with-name"></span><span class="r" id="with-role"></span></span>
      </div>

      <div class="f" id="wrap-person">
        <label for="f-person">Who you want to meet</label>
        <select id="f-person"></select>
      </div>

      <div class="f">
        <label for="f-day">Day</label>
        <select id="f-day"><option value="">— select a day —</option></select>
      </div>

      <div class="f two">
        <div>
          <label for="f-time">Time</label>
          <select id="f-time" disabled><option value="">— select a day first —</option></select>
        </div>
        <div>
          <label for="f-len">Length</label>
          <select id="f-len">
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
          </select>
        </div>
      </div>
      <p class="hint" id="hint-time">All times Berlin (CEST).</p>

      <div class="f" id="wrap-place" hidden>
        <label for="f-place">Where do you want to meet?</label>
        <input id="f-place" maxlength="120" placeholder="Restaurant, bar, hotel lobby…" autocomplete="off">
      </div>

      <div class="f two">
        <div><label for="f-name">Name</label><input id="f-name" maxlength="80" autocomplete="name"></div>
        <div><label for="f-company">Company</label><input id="f-company" maxlength="80" autocomplete="organization"></div>
      </div>
      <div class="f two">
        <div><label for="f-email">Work e-mail</label><input id="f-email" type="email" maxlength="120" autocomplete="email"></div>
        <div><label for="f-phone">Phone <span class="opt">(optional)</span></label><input id="f-phone" type="tel" maxlength="30" autocomplete="tel"></div>
      </div>
      <div class="f">
        <label for="f-note">What do you want to talk about? <span class="opt">(optional)</span></label>
        <textarea id="f-note" maxlength="500" placeholder="Buying stock · selling us your surplus · brand store · logistics"></textarea>
      </div>

      <label class="consent">
        <input type="checkbox" id="f-consent">
        <span>I agree that Monstelo may process my details to arrange this meeting at IFA 2026.
          Controller: Import Eksport Sp. z o.o. Sp.k. Data kept 90 days after the fair.
          <a href="https://monstelo.com/privacy" target="_blank" rel="noopener">Privacy notice</a>.</span>
      </label>

      <button class="send" id="send" type="submit"><span class="arrow">→</span>Book a meeting</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="done" id="done" hidden>
      <div class="tick">✓</div>
      <h2>Meeting booked</h2>
      <div class="when" id="done-when"></div>
      <div class="who" id="done-who"></div>
      <p>Reseller Park, stand H27E-17. A calendar invitation and a confirmation are on their way —
        if they are not there in a minute, check spam.</p>
      <a class="cal" id="done-cal" href="#" target="_blank" rel="noopener">Add to my calendar</a>
    </div>
  </div>

  <footer>
    <noscript><br><b>JavaScript is off — write to us and we will book the slot for you.</b></noscript>
  </footer>
</div>

<button type="button" class="themebtn" id="themebtn">theme</button>

<script src="assets/app.js?v=20260827i"></script>
<script>
  (function(){
    var r=document.documentElement, b=document.getElementById('themebtn');
    function label(){ b.textContent = r.getAttribute('data-theme')==='light' ? 'light' : 'dark'; }
    label();
    b.addEventListener('click', function(){
      var n = r.getAttribute('data-theme')==='light' ? 'dark' : 'light';
      r.setAttribute('data-theme', n);
      try{ localStorage.setItem('ifa-design', n); }catch(e){}
      label();
    });
  })();
</script>
</body>
</html>
